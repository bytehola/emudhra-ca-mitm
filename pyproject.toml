[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "emudhra-ca-mitm"
version = "0.1.0"
description = "面向 Reqable 等上游代理的 eMudhra CA MITM 转发器"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy==12.2.3",
    "pywebview==6.2.1",
    "pyaxmlparser==0.3.31",
]

[project.optional-dependencies]
android = [
    "frida-tools==14.11.0",
]
dev = [
    "httpx>=0.28",
    "websockets>=15",
]

[project.scripts]
emudhra-mitm = "emudhra_mitm.application:main"
emudhra-mitm-cli = "emudhra_mitm.cli:main"
emudhra-mitm-worker = "emudhra_mitm.proxy_worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
